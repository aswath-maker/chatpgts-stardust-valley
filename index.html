<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>ChatGPT's Stardust Valley</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101725;font-family:Inter,system-ui,sans-serif;color:#fff}#app{width:100%;height:100%}canvas{display:block}.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(43,68,96,.35),rgba(8,12,20,.88));z-index:10}.card{width:min(520px,90vw);padding:34px;border:1px solid rgba(255,255,255,.16);border-radius:22px;background:rgba(17,25,38,.88);backdrop-filter:blur(14px);box-shadow:0 25px 80px rgba(0,0,0,.45)}h1{margin:0 0 8px;font-size:36px;letter-spacing:-1px}p{color:#c7d0dc;line-height:1.5}.row{display:flex;gap:10px;margin-top:22px}input,button{font:inherit;border-radius:12px;border:1px solid rgba(255,255,255,.16);padding:12px 14px;background:rgba(255,255,255,.07);color:#fff}input{flex:1;outline:none}button{cursor:pointer;background:#d7b56d;color:#17120b;border:0;font-weight:700}.hidden{display:none!important}.hud{position:fixed;inset:0;pointer-events:none;z-index:5}.top{display:flex;justify-content:space-between;padding:18px}.pill{background:rgba(12,18,28,.62);border:1px solid rgba(255,255,255,.1);padding:8px 12px;border-radius:999px;backdrop-filter:blur(8px);font-size:13px}.bottom{position:absolute;left:18px;bottom:18px;display:flex;gap:8px;flex-wrap:wrap;max-width:760px}.hint{background:rgba(12,18,28,.7);padding:10px 12px;border-radius:12px;font-size:12px;color:#d8e0e8}.cross{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.9);transform:translate(-50%,-50%)}.toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);padding:10px 15px;border-radius:999px;background:rgba(12,18,28,.78);opacity:0;transition:opacity .2s}.toast.show{opacity:1}.map{position:absolute;right:18px;top:70px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(22,31,43,.7);overflow:hidden}.map:before{content:"";position:absolute;left:25%;top:45%;width:60%;height:8%;background:#5b6c78;transform:rotate(-8deg);border-radius:10px}.map:after{content:"";position:absolute;left:46%;top:43%;width:10px;height:10px;border-radius:50%;background:#e8c66d;box-shadow:0 0 12px #e8c66d}
</style>
</head>
<body>
<div id="app"></div>
<div id="start" class="panel"><div class="card"><h1>ChatGPT's Stardust Valley</h1><p>A cozy fantasy town, quiet forests, wandering spirits, and a suspicious amount of work for one protagonist.</p><div class="row"><input id="name" maxlength="18" value="Ren" placeholder="Your name"/><button id="startBtn">Enter Meridian</button></div></div></div>
<div id="hud" class="hud hidden"><div class="top"><div class="pill" id="clock">Day 1 · 08:00</div><div class="pill" id="weather">Sunny · 18°C</div></div><div class="map"></div><div class="cross"></div><div id="toast" class="toast"></div><div class="bottom"><div class="hint">WASD / arrows Move</div><div class="hint">Mouse Orbit</div><div class="hint">Shift Sprint</div><div class="hint">Space Jump</div><div class="hint">E Interact</div><div class="hint">Esc Settings</div></div></div>
<script type="module" src="/src/main.js"></script>
</body></html>
